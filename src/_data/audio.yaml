# Audio Dhamma. One entry per recording. The recordings are stored on archive.org.
# "text" may use *italics* and [links](https://example.org).
items:
  - title: Tuning in
    image: audio-tuning-guided.webp
    kind: Guided meditation
    length: 1 hour
    tone: "#a5ad92"
    tagline: A guided meditation on tuning in to the senses, the hindrances, and the quieting of the mind.
    text: >-
      A one-hour guided meditation in three parts on the theme of "tuning in". Part one explores the six sense spheres, based on the Buddha’s simile of the six animals found at SN 35.247. Part two focuses on the five hindrances, with the Buddha’s simile of the five bowls of water found at AN 5.193. Part three zooms in on the mind and how to remove distracting thoughts, with five different methods the Buddha taught at MN 20.
    page: https://archive.org/details/tuning-in-guided-meditation-3parts
    file: "https://archive.org/download/tuning-in-guided-meditation/Tuning%20In-Guided%20meditation-Complete.mp3"
  - title: Tuning in
    image: audio-tuning-talk.webp
    kind: Dhamma talk
    length: 35 min
    tone: "#b7a685"
    tagline: A talk on finding balance in practice through the Buddha’s simile of the lute.
    text: >-
      A 35 minute reflection on balance in practice, based on the Soṇa Sutta (AN 6.55) and the Buddha’s simile of the lute. The talk explores the meaning of sama ("in tune"), the five spiritual faculties as five strings, and how to maintain harmony in practice. The talk was given at [Dhammagiri forest hermitage](https://www.dhammagiri.net/) outside Brisbane, Australia, on 2 November 2025.
    page: https://archive.org/details/tuning-in-dhamma-talk
    file: "https://archive.org/download/tuning-in-dhamma-talk/Tuning%20In-Dhamma%20talk.mp3"
  - title: Balloons
    image: audio-balloons.webp
    kind: Dhamma talk
    length: 70 min
    tone: "#b7a685"
    tagline: A reflection on human experience, from celebration to the ego’s final *pop*.
    text: >-
      This seventy-minute Dhamma talk uses five coloured balloons to explore the liberating textures of human experience. The yellow balloon reflects celebration, change, and the resilience of joy. The blue balloon presents the Buddha as a compassionate "party-pooper" encouraging wiser forms of happiness. The red balloon highlights the strength of true friendship through uplifting stories. The white balloon rises into the realm of shared narratives and a unified world. And the black balloon goes *pop*, rejoicing in the death of the ego. The talk was given at [Muttodaya forest monastery](https://muttodaya.org/), Germany, on January 11, 2025.
    page: https://archive.org/details/balloons-jaya
    file: https://archive.org/download/balloons-jaya/Balloons-Dhammatalk-Jaya.mp3
  - title: Solitude
    image: audio-solitude.webp
    kind: Dhamma talk
    length: 35 min
    tone: "#b7a685"
    tagline: A talk on the inner steadiness required for transforming solitude.
    text: >-
      A 35 minute reflection on the theme of solitude. Part 1 explores the Buddha’s repeated praise of withdrawal and the importance of being alone, drawing on suttas AN 10.48, AN 2.44, AN 4.160, AN 5.167, and AN 3.95. Part 2 turns to the forest bull elephant seeking quiet nourishment (AN 9.40) and the difficulty of solitude, expressed in the simile of the bull elephant and the hare (AN 10.99). Four kinds of retreat (AN 4.138) are also discussed. Part 3 broadens the theme to how to be alone with others, with supporting reflections from MN 32, and MN 122. The talk was given at [Muttodaya forest monastery](https://muttodaya.org/), Germany, on August 24, 2024.
    page: https://archive.org/details/solitude-jaya
    file: https://archive.org/download/solitude-jaya/Solitude-Dhammatalk-Jaya.mp3
  - title: Dreams
    image: audio-dreams.webp
    kind: Dhamma talk
    length: 1 hour
    tone: "#b7a685"
    tagline: A journey from ancient symbolic visions to the cultivation of wakefulness in everyday life.
    text: >-
      A one-hour Dhamma talk in two parts. Part 1, called "Dreams of Awakening", explores the Buddha’s Five Great Dreams as preserved in the Mahāsupina Sutta (AN 5.196), supported by a short meditation. Part 2, "Awakened Dreams", expands the theme into modern understanding of sleep, dreaming, and lucid awareness, inviting a deeper exploration of waking up both in dreams and in life itself. The talk was given at [Muttodaya forest monastery](https://muttodaya.org/), Germany, on February 3, 2024.
    page: https://archive.org/details/dreams-dhammatalk-jayadhamma
    file: https://archive.org/download/dreams-dhammatalk-jayadhamma/Dreams-Dhammatalk-Jaya.mp3
  - title: Mistakes
    image: audio-mistakes.webp
    kind: Dhamma talk
    tone: "#b7a685"
    tagline: A talk about life changing mistakes.
    text: >-
      Mistakes sometimes turn into "portals of discovery," leading us into new directions, and perhaps even changing our lives for the better. This Dhamma talk tells the story of the five biggest mistakes that in the end led a young Swedish man to ordain as a bhikkhu in Burma (Myanmar) in 2020. The talk – the first ever by me in the West – was given at [Muttodaya forest monastery](https://muttodaya.org/), Germany, on December 23, 2023.
    page: https://archive.org/details/mistakes-dhammatalk
    file: https://archive.org/download/mistakes-dhammatalk/Mistakes-Dhammatalk-Jaya.mp3
