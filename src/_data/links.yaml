# Links page. Add a link by copying one line of an "items" list. Each line: {name, url, text}.
# A link that needs a Google account gets ", google: true" and is kept in the "Needs a Google account" group.
# Credit shown at the top of the page (Markdown).
credit: "Most of the links below come from *Online Dhamma Resources*, a list compiled by Kusalacāra Bhikkhu for the [Early Buddhist Obsidian Vault](https://github.com/dhamma-vinaya-connections/early-buddhist-connections/releases). Many thanks to him for sharing it."
recommended:
  title: "Start here"
  intro: "New to these sites? Here are eight well-known places to begin, from different kinds of resources: sutta texts, a classic archive, talks, a dictionary, a publisher, a magazine and a forum."
  items:
    - {name: "SuttaCentral", url: "https://suttacentral.net/", text: "Main hub for early Buddhist texts with multiple translations, parallels, segmented Pāli, and tools."}
    - {name: "Access to Insight (archive)", url: "https://www.accesstoinsight.org/", text: "Classic collection of Theravāda sutta translations and essays (archived but still widely referenced)."}
    - {name: "Dhamma Talks (Thanissaro Bhikkhu)", url: "https://www.dhammatalks.org/suttas/", text: "Large collection of sutta translations, books, and essays from the Thai Forest tradition."}
    - {name: "Dharma Seed", url: "https://www.dharmaseed.org/", text: "Dhamma talks from most teachers."}
    - {name: "Digital Pāli Dictionary (DPDict)", url: "https://dpdict.net/", text: "Modern, searchable Pāli–English dictionary, useful alongside any Pāli text. Online and offline."}
    - {name: "Buddhist Publication Society (BPS)", url: "https://bps.lk/", text: "Sri Lankan publisher offering a vast library of downloadable Theravāda books and booklets."}
    - {name: "Tricycle", url: "https://tricycle.org/", text: "A well-known Buddhist magazine."}
    - {name: "Dhamma Wheel", url: "https://www.dhammawheel.com/", text: "Large English-language discussion forum focused on Theravāda Buddhism."}
groups:
  - title: "Canonical links"
    id: canonical
    subgroups:
      - title: "Translations (Pāli Nikāyas & related)"
        items:
          - {name: "SuttaCentral", url: "https://suttacentral.net/", text: "Main hub for early Buddhist texts with multiple translations, parallels, segmented Pāli, and tools."}
          - {name: "The Buddha’s Words", url: "https://thebuddhaswords.net/", text: "Clean HTML versions of many Pāli suttas in English and Pāli, organised by Nikāya."}
          - {name: "Dhamma.gift", url: "https://dhamma.gift/", text: "Lightweight reader that aggregates sutta texts from multiple sources; good for quick reading."}
          - {name: "Dhamma Talks (Thanissaro Bhikkhu)", url: "https://www.dhammatalks.org/suttas/", text: "Large collection of sutta translations, books, and essays from the Thai Forest tradition."}
          - {name: "Ancient Buddhist Texts", url: "https://ancient-buddhist-texts.net/Buddhist-Texts/index.htm", text: "Pāli and English texts, metrical editions, and study material by Ānandajoti Bhikkhu."}
          - {name: "Pa-Auk Tipiṭaka Project", url: "https://tipitaka.paauksociety.org/", text: "Online Pāli Canon from the Pa-Auk tradition, with some supporting material."}
          - {name: "SuttaFriends", url: "https://suttafriends.org/sutta/", text: "Accessible English translations of Pāli suttas, with some Pāli text and topic-based navigation."}
          - {name: "Dharmafarer (Sutta Discovery)", url: "https://www.themindingcentre.org/dharmafarer/sutta-titles-2", text: "Annotated translations and in-depth study notes by Piya Tan; strong focus on early suttas."}
          - {name: "Hillside Hermitage – Suttas", url: "https://suttas.hillsidehermitage.org/", text: "Suttas and talks from Ajahn Nyanamoli and the Hillside Hermitage community, practice-focused."}
          - {name: "Colombo Dhamma Friends / “Serene Colombo”", url: "https://www.serenecolombo.org/category/suttas/", text: "Additional English sutta translations and teachings, often overlapping with SuttaFriends."}
          - {name: "Access to Insight (archive)", url: "https://www.accesstoinsight.org/", text: "Classic collection of Theravāda sutta translations and essays (archived but still widely referenced)."}
          - {name: "ReadingFaithfully.org", url: "https://readingfaithfully.org/", text: "Resources to build a regular sutta reading practice: guides, reading plans, and study tips."}
          - {name: "Buddha Dust", url: "https://buddhadust.net/backmatter/indexes/sutta/sutta_toc.htm", text: "Extensive index pointing to sutta translations across several websites and collections."}
          - {name: "A Buddhist View", url: "https://abuddhistview.com/", text: "Essays and reflections grounded in early Buddhist teachings and practice."}
      - title: "Pāli text & study tools"
        items:
          - {name: "BuddhaNexus – Pāli", url: "https://buddhanexus.net/pli/", text: "Pāli text viewer with powerful parallel search across Pāli Nikāyas and Chinese Āgamas."}
          - {name: "Tipitaka.org", url: "https://www.tipitaka.org", text: "Online Pāli Canon in multiple scripts, with line-by-line text navigation."}
          - {name: "Digital Pāli Reader (web)", url: "https://www.digitalpalireader.online/_dprhtml/index.html", text: "Browser-based version of the classic DPR: instant word lookup and dictionary integration."}
          - {name: "Tipitaka Pali Reader", url: "https://americanmonk.org/tipitaka-pali-reader/", text: "Reader app with integrated dictionaries and search, designed for Pāli Canon study."}
          - {name: "Tipitaka.app", url: "https://tipitaka.app/", text: "Mobile-friendly web app for browsing the Pāli Canon."}
          - {name: "Tipitaka Sutta (sutta.org)", url: "https://tipitaka.sutta.org", text: "Alternative front-end to Pāli texts with its own navigation structure."}
          - {name: "Digital Pāli Dictionary (DPDict)", url: "https://dpdict.net/", text: "Modern, searchable Pāli–English dictionary, useful alongside any Pāli text. Online and offline."}
          - {name: "PTS Converter (Dhamma-Dāna)", url: "https://pts.dhamma-dana.de", text: "Converts between PTS page references and standard sutta references for the main Nikāyas."}
          - {name: "Open.tipitaka.lk", url: "https://open.tipitaka.lk", text: "Sri Lankan Tipitaka in various scripts and include audio for all pali texts."}
      - title: "Āgamas & other early canons"
        items:
          - {name: "Dharma Pearls", url: "https://canon.dharmapearls.net/", text: "High-quality English translations of Chinese Āgama collections and related early Buddhist texts."}
          - {name: "BDK America (Bukkyō Dendō Kyōkai)", url: "https://www.bdkamerica.org/tripitaka-list/", text: "Translations from the Chinese canon, including some Āgama and early Mahāyāna texts."}
          - {name: "Dharmamitra", url: "https://dharmamitra.org/", text: "Extensive collection of English translations from the Chinese Buddhist Canon by Bhikshu Dharmamitra, covering Mahāyāna Sūtras, Vinaya, and Śāstras."}
          - {name: "Bhikkhu Anālayo – meditation instructions", url: "https://agamaresearch.dila.edu.tw/bhikkhu-analayo-meditation-instructions", text: "A page from the Āgama Research Group (Dharma Drum Institute) that provides meditation‑instruction audio and transcripts by Bhikkhu Anālayo, covering practices like Satipaṭṭhāna (mindfulness), Ānāpānasati (breath mindfulness), the Brahmavihāras, and emptiness."}
      - title: "Audio – listening to the suttas"
        items:
          - {name: "PaliAudio.com", url: "https://www.paliaudio.com/", text: "Professional readings of Pāli Nikāya suttas (often based on SuttaCentral translations)."}
          - {name: "Sutta Readings", url: "https://www.suttareadings.net/", text: "Curated audio readings of suttas from various translators and sources."}
          - {name: "SuttaCentral Voice", url: "https://www.sc-voice.net/?src=sc#/wiki/toc", text: "SuttaCentral's audio front-end: listen to Pāli and translations with navigation synced to segments."}
          - {name: "Audio Tipitaka (Audtip)", url: "https://audtip.org/", text: "Long-term project offering audio versions of sutta translations; open to volunteers."}
          - {name: "Dharma Audiobooks", url: "http://dharmaaudiobooks.com/", text: "Professionally produced audiobooks of suttas, talks, and classic Buddhist writings."}
      - title: "Helper tools & research"
        items:
          - {name: "Simsapa Dhamma Reader", url: "https://simsapa.github.io/", text: "Excellent sutta reader and Pali dictionary application."}
          - {name: "ReadingFaithfully – Sutta Tools Lab", url: "https://readingfaithfully.org/lab/", text: "Small utilities for sutta study: citation helpers, random sutta pickers, and link tools."}
          - {name: "Awesome SuttaCentral (developer tools)", url: "https://suttacentral.github.io/awesome/", text: "Curated list of tools, APIs, and add-ons built around SuttaCentral (e.g. Voice, Bilara tools)."}
  - title: "AI tools"
    id: ai
    items:
      - {name: "NORBU", url: "https://norbu-ai.org/en/norbu", text: "AI guide of the foundational principles of Buddhist teachings, help clarify key terms and concepts"}
      - {name: "NORBU Early Buddhist Texts", url: "https://norbu-ai.org/en/norbu_ebt", text: "contains only suttas from the Pali Tipitaka, Chinese Agamas, Sanskrit fragments as well as some sutras preserved in Tibetan translation."}
  - title: "Visual & charts"
    id: visual
    items:
      - {name: "DhammaCharts.org", url: "https://www.dhammacharts.org/", text: "Visual charts and diagrams of core teachings (e.g. 37 wings, dependent origination, jhānas)."}
  - title: "Buddhist education and Dharma blogging"
    id: education
    items:
      - {name: "Digital Dictionary of Buddhism", url: "http://buddhism-dict.net/", text: "Large, scholarly online dictionary of Buddhist terms, texts, and people (requires login/guest access)."}
      - {name: "La Parole du Bouddha", url: "http://www.buddha-vacana.org/fr/index.html", text: "French version of Buddha-Vacana offering Pāli suttas side-by-side with French translations."}
      - {name: "Abhidhamma.com", url: "https://abhidhamma.com/", text: "Dedicated to the Theravāda Abhidhamma with systematic explanations and digital translations."}
      - {name: "Agama (Buddhason)", url: "https://agama.buddhason.org/", text: "Chinese-language digital library providing Āgama sūtras alongside parallel Pāli texts."}
      - {name: "Virtual Autopsy (Australian Museum)", url: "https://autopsy2021.australian.museum/", text: "Interactive exhibit of a forensic autopsy; useful for contemplating the body and impermanence."}
      - {name: "Buddhist Publication Society (BPS)", url: "https://bps.lk/", text: "Sri Lankan publisher offering a vast library of downloadable Theravāda books and booklets."}
      - {name: "Buddhist eLibrary", url: "https://buddhistelibrary.org/", text: "Multi-tradition repository of downloadable eBooks, audio, and study materials."}
      - {name: "Buddhist University", url: "https://buddhistuniversity.net/", text: "Free online platform offering structured courses, syllabuses, and a digital library for early Buddhist studies."}
      - {name: "Critical Pāli Dictionary (Online)", url: "https://cpd.uni-koeln.de/", text: "Comprehensive, scholarly lexicon of the Pāli language maintained by the University of Cologne."}
      - {name: "Dhamma Dāna (German)", url: "https://dhamma-dana.de/", text: "Project offering free German-language Buddhist books, audio lectures, and study materials."}
      - {name: "Fake Buddha Quotes", url: "https://fakebuddhaquotes.com/", text: "Site investigating and debunking quotes falsely attributed to the Buddha."}
      - {name: "AnkiWeb Forums", url: "https://forums.ankiweb.net/", text: "Community support for Anki users; useful for troubleshooting flashcards for memorization."}
      - {name: "Gandhari.org", url: "https://gandhari.org/", text: "Scholarly collection of early Buddhist texts, inscriptions, and manuscripts in the Gāndhārī language."}
      - {name: "Jātaka Stories", url: "https://jatakastories.div.ed.ac.uk/", text: "Database of Jātaka tales with Pāli/Sanskrit text, English translations, and visual artwork."}
      - {name: "Leigh Brasington", url: "https://leighb.com/", text: "Teachings, articles, and resources on jhāna and insight practices from a senior Theravāda teacher."}
      - {name: "SC Citation Helper", url: "https://mini-sc.netlify.app/", text: "Simple tool to generate standardized citations (e.g., DN.1) for Pāli texts."}
      - {name: "Old Buddhist Objects (OBO)", url: "https://obo.genaud.net/", text: "Web library of selected Pāli Canon texts and suttas available in readable PDF formats."}
      - {name: "Dictionary of Pāḷi Roots", url: "https://obo.genaud.net/backmatter/glossology/pali_roots.htm", text: "Lists Pāḷi verbal roots with meanings and Sanskrit cognates for deep language study."}
      - {name: "Pali Translation Project", url: "https://palitranslation.org/", text: "Project aiming to produce and host high-quality, searchable English translations of the Pāli Canon."}
      - {name: "Pariyatti", url: "https://pariyatti.org/", text: "Non-profit bookstore and resource hub for Theravāda literature and Vipassana teachings."}
      - {name: "Pitaka.lk", url: "https://pitaka.lk/main/", text: "The Pāli Tipiṭaka available online with parallel Sinhala translations."}
      - {name: "Stanford Encyclopedia: Buddha", url: "https://plato.stanford.edu/entries/buddha/", text: "Peer-reviewed philosophical article covering the Buddha's life, metaphysics, and epistemology."}
      - {name: "Schatztruhe Pali-Kanon", url: "https://schatztruhe-palikanon.net/", text: "German website providing structured explanations and study resources for the Pāli Canon."}
      - {name: "Sobhana.net", url: "https://sobhana.net/", text: "Audio-visual library of Dhamma talks, sutta chants, and texts in Pāli and English."}
      - {name: "TipitakaPali.org", url: "https://tipitakapali.org/", text: "Platform for the Chaṭṭha Saṅgāyana Tipiṭaka with integrated dictionaries and search tools."}
      - {name: "Buddha-Vacana", url: "https://www.buddha-vacana.org/", text: "Pāli learning platform with word-by-word glossaries for selected suttas."}
      - {name: "BuddhaNet", url: "https://www.buddhanet.net/", text: "Long-standing directory of Buddhist centers, eBooks, and global resources."}
      - {name: "Dhamma.ru", url: "https://www.dhamma.ru/", text: "Russian-language website offering Theravāda translations, books, and meditation guidance."}
      - {name: "Dhamma Wheel", url: "https://www.dhammawheel.com/", text: "Large English-language discussion forum focused on Theravāda Buddhism."}
      - {name: "DhammaWiki", url: "https://www.dhammawiki.com/index.php?title=Main_Page", text: "Encyclopedia of Buddhist teachings and terminology, focused on early Buddhism."}
      - {name: "OCBS Courses", url: "https://www.ocbs-courses.org/", text: "Self-paced academic Pāli language courses from the Oxford Centre for Buddhist Studies."}
      - {name: "Oxford Bibliographies: Buddhism", url: "https://www.oxfordbibliographies.com/browse?module_0=obo-9780195393521", text: "Curated academic research guides and reading lists on Buddhist topics."}
      - {name: "Palikanon.com", url: "https://www.palikanon.com/", text: "German and English collection of Buddhist texts, dictionaries, and meditation manuals."}
      - {name: "Words of the Buddha", url: "https://www.wordsofthebuddha.org/", text: "Side-by-side Pāli-English corpus with contextual tooltips and notes."}
  - title: "Publishers, magazines and teachers"
    id: publishers
    items:
      - {name: "Buddhist Door", url: "https://www.buddhistdoor.net/", text: "Buddhist journal and multimedia platform."}
      - {name: "Dharma Gates", url: "https://www.dharma-gates.org", text: "Promoting Buddhist meditation for young adults."}
      - {name: "BuddhaDharma", url: "https://www.lionsroar.com/buddhadharma/", text: "Online articles about Buddhist practice and study."}
      - {name: "Tricycle", url: "https://tricycle.org/", text: "A well-known Buddhist magazine."}
      - {name: "Amaravati Publications", url: "https://amaravati.org/dhamma-books/", text: "The biggest Ajahn Chah monastery in England, which also publishes many of its books."}
      - {name: "Suan Mokkh", url: "https://www.suanmokkh.org/", text: "Books, audio, poems, and more by Ajahn Buddhadasa."}
      - {name: "Ashintejaniya.org", url: "https://ashintejaniya.org/", text: "Home of Sayadaw U Tejaniya, with books available in many languages."}
      - {name: "Aim Well", url: "https://aimwell.org/", text: "Books and Buddhist information by Bhikkhu Pesala."}
  - title: "Podcasts and Dhamma talks"
    id: podcasts
    items:
      - {name: "Be Here Now Network", url: "https://beherenownetwork.com/", text: "A network of mindfulness and spirituality podcasts."}
      - {name: "Dharma Seed", url: "https://www.dharmaseed.org/", text: "Dhamma talks from most teachers."}
      - {name: "Audio Dharma", url: "https://www.audiodharma.org/", text: "Dhamma talks from most teachers can be downloaded here."}
      - {name: "Pariyatti podcasts", url: "https://pariyatti.org/Free-Resources/Podcasts/", text: "A selection of different video and audio podcasts."}
      - {name: "Insight Myanmar", url: "https://insightmyanmar.org/", text: "Podcast about Dhamma and meditation in Myanmar."}
  - title: "Needs a Google account"
    id: google
    intro: "The links in this group open on Google and need a Google account."
    items:
      - {name: "Wolf's Guide to Dharma Books & Practice", url: "https://docs.google.com/document/d/1hlk6x2XJy8ZQfdYYTibCx2ADRtZDLPqJifQrggic47k/", text: "A perhaps not 100% legal document, filled with useful information about Buddhist meditation and beyond.", google: true}
    subgroups:
      - title: "Notebook LM"
        url: "https://notebooklm.google/"
        intro: "It is a great AI tool that is limited only by the selected resources. It's good for finding needed references. There are a few useful collections available:"
        items:
          - {name: "Early Suttas", url: "https://notebooklm.google.com/notebook/6a9818aa-3045-4f35-8afb-ec5f13571d40", text: "mūla of EBT", google: true}
          - {name: "Sutta Piṭaka + Commentaries", url: "https://notebooklm.google.com/notebook/68815e7f-c5b6-4b12-a66e-9f80729b9015", text: "Second basket of the Tipiṭaka, mūla + atthakathā", google: true}
          - {name: "Vinaya", url: "https://notebooklm.google.com/notebook/d5bdd9b7-1b25-4e9c-b3ea-f19bb93c9081", text: "First basket of the Tipiṭaka, mūla part", google: true}
          - {name: "Vinaya + Commentaries", url: "https://notebooklm.google.com/notebook/118e3516-95d1-4f8d-9f8b-371ee078f621", text: "everything from the Tipiṭaka related to Vinaya - mūla + atthakathā + ṭīkā + aññā", google: true}
          - {name: "Early Suttas + Vinaya", url: "https://notebooklm.google.com/notebook/62ff61c6-b9e1-4524-8447-82b00ca6f6ff", text: "mūla: EBT* and Vinaya", google: true}
          - {name: "Pātimokkha Pali Study", url: "https://notebooklm.google.com/notebook/36c7a255-1b16-455c-bcde-14574d8f0dd2", text: "sources include: Bhikkhu Vibhaṅga Pāli–English (Ven. Brahmali); Pātimokkha Analysis — normal and extended versions (Ven. Ñāṇatusita); Buddhist Monastic Code I and II (Ven. Ṭhānissaro); SBS Pātimokkha Analysis", google: true}
          - {name: "Anupubbasikkhā Gradual Illumination", url: "https://notebooklm.google.com/notebook/317a21a5-267c-4153-9543-b5bcfdcc6625?artifactId=3dcc3a5a-9b0b-488b-aa00-aa60764f6340", text: "everything from Tipiṭaka (mūla, atthakathā, ṭīkā) related to the Gradual Training, compiled by Ā Virāga.", google: true}
          - {name: "Pāli Tipiṭaka", url: "https://notebooklm.google.com/notebook/8e21e964-8804-437d-a355-ed93666058ca", text: "Tipiṭaka mūla", google: true}
          - {name: "Visuddhimagga", url: "https://notebooklm.google.com/notebook/13187f85-d540-42c1-8ea8-5f723c5afab3", google: true}
