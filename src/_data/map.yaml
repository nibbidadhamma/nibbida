# Meditation Map of the Dhamma page. The map itself is a saved list in Google Maps.
# The places below are the "popular highlights" from the old nibbida.com page.
# lat/lng are for a map on this site later (not shown yet). Leave them empty if unknown.
# Map tiles. The default is OpenStreetMap's own server (no key). Its labels are in the local language of each country.
# For English only, use a map WITHOUT labels and set labels: false: the page then writes the names of countries and
# places in English itself. Example with CARTO (free key from https://carto.com/basemaps/apikey, sent by email):
#   url: "https://basemaps.cartocdn.com/rastertiles/light_nolabels/{z}/{x}/{y}.png?key=YOUR_KEY"
#   dark_url: "https://basemaps.cartocdn.com/rastertiles/dark_nolabels/{z}/{x}/{y}.png?key=YOUR_KEY"
#   attribution: "© OpenStreetMap contributors © CARTO"
#   labels: false
# Without "dark_url" the dark theme darkens the tiles with a filter.
tiles:
  url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
  dark_url: ""
  attribution: "© OpenStreetMap contributors"
  labels: true
  max_zoom: 18
map_url: https://goo.gl/maps/vLWGQWL9VHfK5evE9
