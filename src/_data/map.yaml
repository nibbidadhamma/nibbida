# Meditation Map of the Dhamma page: map style, links and guides. The places themselves are one file each in src/map/places/.
# Map tiles: CARTO "Positron" (light) and "Dark Matter" (dark) without labels. The key is a free CARTO basemaps key
# (carto.com/basemaps/apikey); it is meant to be public. OpenStreetMap's own server is the fallback (set "url" to
# https://tile.openstreetmap.org/{z}/{x}/{y}.png, "dark_url" to "" and "labels" to true), but its labels are in each country's language.
# For English only, use a map WITHOUT labels and set labels: false: the page then writes the names of countries and
# places in English itself. Example with CARTO (free key from https://carto.com/basemaps/apikey, sent by email):
#   url: "https://basemaps.cartocdn.com/rastertiles/light_nolabels/{z}/{x}/{y}.png?key=YOUR_KEY"
#   dark_url: "https://basemaps.cartocdn.com/rastertiles/dark_nolabels/{z}/{x}/{y}.png?key=YOUR_KEY"
#   attribution: "© OpenStreetMap contributors © CARTO"
#   labels: false
# Without "dark_url" the dark theme darkens the tiles with a filter.
tiles:
  url: "https://basemaps.cartocdn.com/rastertiles/light_nolabels/{z}/{x}/{y}.png?key=cb1_4sg1_1_57bebc49714968a6d8304109"
  dark_url: "https://basemaps.cartocdn.com/rastertiles/dark_nolabels/{z}/{x}/{y}.png?key=cb1_4sg1_1_57bebc49714968a6d8304109"
  attribution: "© OpenStreetMap contributors © CARTO"
  labels: false
  max_zoom: 18
map_url: https://goo.gl/maps/vLWGQWL9VHfK5evE9
share_images:
  - {label: with name, url: "https://drive.google.com/file/d/1jEtR99kl3w877TS3-oHylojjMBS3Qh1g/view?usp=sharing"}
